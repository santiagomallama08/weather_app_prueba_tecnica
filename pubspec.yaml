name: weather_events_app
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  get_it: ^9.2.1
  dio: ^5.9.2
  go_router: ^17.2.3
  connectivity_plus: ^7.1.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  realm: ^20.2.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  equatable: ^2.0.8
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/dev/icons/
    - assets/dev/images/
    - assets/prod/icons/
    - assets/prod/images/
    - assets/common/fonts/

